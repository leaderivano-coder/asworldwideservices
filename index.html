    <script>
      // Suppress unhandled rejections from client browser extensions (e.g. MetaMask, Web3 wallet injection)
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e && e.reason ? (e.reason.message || String(e.reason)) : '';
        if (typeof reason === 'string' && (
          reason.toLowerCase().includes('metamask') ||
          reason.toLowerCase().includes('ethereum') ||
          reason.toLowerCase().includes('web3') ||
          reason.includes('Failed to connect')
        )) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);

      window.addEventListener('error', function(e) {
        var msg = e && e.message ? String(e.message) : '';
        if (typeof msg === 'string' && (
          msg.toLowerCase().includes('metamask') ||
          msg.toLowerCase().includes('ethereum') ||
          msg.toLowerCase().includes('web3')
        )) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
